name: Static Web App

on:
  push:
    branches:
      - "major/**"
      - "minor/**"
      - "patch/**"
    paths:
      - "frontend/**"
      - "functions/**"
      - "docs/blog/**"
      - "scripts/build_blog.py"
      - "scripts/notify_blog_posts.py"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        required: true
        default: dev
        options: [dev, prd]
      notify_posts:
        description: "Blog post notification mode"
        type: choice
        required: true
        default: none
        options: [none, changed, all]
      deploy_site:
        description: "Deploy the Static Web App before notifying"
        type: boolean
        required: true
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to SWA
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'prd' }}
    env:
      SWA_NAME: stapp-cvengine-${{ inputs.environment || 'prd' }}-uks-01
      SWA_RESOURCE_GROUP: rg-cvengine-${{ inputs.environment || 'prd' }}-uks-01
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Build blog
        run: python scripts/build_blog.py

      - name: Install API dependencies
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_site }}
        run: npm ci
        working-directory: functions

      - name: Azure login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch secrets from Key Vault
        uses: skyhaven-ltd/pipeline-engineering-github-actions/actions/keyvault-secrets@6cfa143b42ff464e4101d69c09945db9fac369e5 # v2.0.0
        with:
          keyvault_name: kv-platform-${{ inputs.environment || 'prd' }}-uks-02
          secrets: |
            BLOG_NOTIFY_SECRET=cvengine-blog-notify-secret
            BREVO_API_KEY=cvengine-brevo-api-key
          login: "false"

      - name: Fetch SWA deployment token
        id: swa-token
        run: |
          set -euo pipefail
          TOKEN=$(az staticwebapp secrets list \
            --name "${SWA_NAME}" \
            --resource-group "${SWA_RESOURCE_GROUP}" \
            --query "properties.apiKey" -o tsv)
          DEFAULT_HOSTNAME=$(az staticwebapp show \
            --name "${SWA_NAME}" \
            --resource-group "${SWA_RESOURCE_GROUP}" \
            --query "defaultHostname" -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "default_hostname=$DEFAULT_HOSTNAME" >> "$GITHUB_OUTPUT"

      - name: Configure blog email app settings
        env:
          # BLOG_NOTIFY_SECRET and BREVO_API_KEY come from the Key Vault fetch step
          BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
          BREVO_SENDER_ID: ${{ vars.BREVO_SENDER_ID }}
          EMAIL_DAILY_LIMIT: ${{ vars.EMAIL_DAILY_LIMIT || '250' }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME || 'Liam Goodchild' }}
          EMAIL_REPLY_TO: ${{ vars.EMAIL_REPLY_TO }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://skyhaven.ltd' }}
        run: |
          set -euo pipefail

          if [ -z "${BLOG_NOTIFY_SECRET}" ] \
            || [ -z "${BREVO_API_KEY}" ] \
            || [ -z "${BREVO_LIST_ID}" ] \
            || [ -z "${EMAIL_FROM}" ]; then
            echo "Brevo settings are incomplete; skipping blog email app settings."
            exit 0
          fi

          settings=(
            "BLOG_NOTIFY_SECRET=${BLOG_NOTIFY_SECRET}"
            "BREVO_API_KEY=${BREVO_API_KEY}"
            "BREVO_LIST_ID=${BREVO_LIST_ID}"
            "EMAIL_DAILY_LIMIT=${EMAIL_DAILY_LIMIT}"
            "EMAIL_FROM=${EMAIL_FROM}"
            "EMAIL_FROM_NAME=${EMAIL_FROM_NAME}"
            "PUBLIC_SITE_URL=${PUBLIC_SITE_URL}"
          )

          if [ -n "${EMAIL_REPLY_TO}" ]; then
            settings+=("EMAIL_REPLY_TO=${EMAIL_REPLY_TO}")
          fi

          if [ -n "${BREVO_SENDER_ID}" ]; then
            settings+=("BREVO_SENDER_ID=${BREVO_SENDER_ID}")
          fi

          az staticwebapp appsettings set \
            --name "${SWA_NAME}" \
            --resource-group "${SWA_RESOURCE_GROUP}" \
            --setting-names "${settings[@]}"

      - name: Deploy Static Web App
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_site }}
        uses: azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        env:
          NODE_VERSION: "20"
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          api_location: functions
          output_location: ""

      - name: Notify blog subscribers
        env:
          BLOG_NOTIFY_ON_PUSH: ${{ vars.BLOG_NOTIFY_ON_PUSH || 'false' }}
          # BLOG_NOTIFY_SECRET comes from the Key Vault fetch step
          BLOG_NOTIFY_URL: https://${{ steps.swa-token.outputs.default_hostname }}/api/NotifyPost
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          NOTIFY_POSTS_INPUT: ${{ inputs.notify_posts || 'none' }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://skyhaven.ltd' }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            notify_mode="${NOTIFY_POSTS_INPUT}"
          elif [ "${BLOG_NOTIFY_ON_PUSH}" = "true" ]; then
            notify_mode="changed"
          else
            notify_mode="none"
          fi

          python scripts/notify_blog_posts.py --mode "${notify_mode}"
