<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Blog | Under Construction</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Space Grotesk", system-ui, sans-serif;
        background: #030712;
        color: #f9fafb;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .container {
        text-align: center;
        padding: 2rem;
        max-width: 600px;
      }

      .scene {
        position: relative;
        height: 220px;
        margin-bottom: 2rem;
      }

      /* The beaver */
      .beaver {
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(-70px);
        animation: beaver-work 1.5s ease-in-out infinite;
      }

      .beaver-body {
        width: 60px;
        height: 45px;
        background: #8b6914;
        border-radius: 30px 30px 20px 20px;
        position: relative;
      }

      .beaver-head {
        width: 40px;
        height: 35px;
        background: #a07818;
        border-radius: 50% 50% 40% 40%;
        position: absolute;
        top: -20px;
        right: -15px;
      }

      .beaver-eye {
        width: 6px;
        height: 6px;
        background: #030712;
        border-radius: 50%;
        position: absolute;
        top: 10px;
        right: 8px;
        animation: blink 3s ease-in-out infinite;
      }

      .beaver-nose {
        width: 8px;
        height: 6px;
        background: #5c4510;
        border-radius: 50%;
        position: absolute;
        top: 16px;
        right: 3px;
      }

      .beaver-teeth {
        width: 10px;
        height: 6px;
        background: #fff;
        position: absolute;
        bottom: 2px;
        right: 5px;
        border-radius: 0 0 3px 3px;
        display: flex;
        gap: 1px;
        justify-content: center;
      }

      .beaver-teeth::after {
        content: "";
        width: 1px;
        height: 100%;
        background: #ccc;
      }

      .beaver-tail {
        width: 35px;
        height: 12px;
        background: #5c4510;
        border-radius: 10px;
        position: absolute;
        bottom: 5px;
        left: -25px;
        transform: rotate(-10deg);
      }

      .beaver-hat {
        width: 30px;
        height: 15px;
        background: #f59e0b;
        position: absolute;
        top: -12px;
        right: 2px;
        border-radius: 4px 4px 0 0;
      }

      .beaver-hat::after {
        content: "";
        width: 38px;
        height: 4px;
        background: #d97706;
        position: absolute;
        bottom: 0;
        left: -4px;
        border-radius: 2px;
      }

      /* Wall */
      .wall {
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(10px);
        display: flex;
        flex-direction: column-reverse;
        gap: 2px;
      }

      .brick-row {
        display: flex;
        gap: 2px;
      }

      .brick-row:nth-child(even) {
        margin-left: 12px;
      }

      .brick {
        width: 24px;
        height: 12px;
        background: #b45309;
        border-radius: 2px;
        border: 1px solid #92400e;
      }

      /* Floating brick being placed */
      .floating-brick {
        position: absolute;
        bottom: 130px;
        left: 50%;
        transform: translateX(20px);
        animation: place-brick 1.5s ease-in-out infinite;
      }

      .floating-brick .brick {
        width: 24px;
        height: 12px;
      }

      /* Ground */
      .ground {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 300px;
        height: 40px;
        background: linear-gradient(to bottom, #1a3a1a, #0f290f);
        border-radius: 50% 50% 0 0;
      }

      .ground::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: #22c55e;
        border-radius: 50%;
        opacity: 0.6;
      }

      @keyframes beaver-work {
        0%,
        100% {
          transform: translateX(-70px) rotate(0deg);
        }
        25% {
          transform: translateX(-70px) rotate(3deg);
        }
        75% {
          transform: translateX(-70px) rotate(-2deg);
        }
      }

      @keyframes place-brick {
        0% {
          opacity: 0;
          transform: translateX(20px) translateY(-20px);
        }
        30% {
          opacity: 1;
          transform: translateX(20px) translateY(-10px);
        }
        70% {
          opacity: 1;
          transform: translateX(20px) translateY(0);
        }
        100% {
          opacity: 0;
          transform: translateX(20px) translateY(0);
        }
      }

      @keyframes blink {
        0%,
        90%,
        100% {
          transform: scaleY(1);
        }
        95% {
          transform: scaleY(0.1);
        }
      }

      h1 {
        font-size: clamp(2rem, 5vw, 3rem);
        font-weight: 700;
        margin-bottom: 1rem;
        letter-spacing: -0.03em;
      }

      .gradient-text {
        background: linear-gradient(
          135deg,
          #3b82f6 0%,
          #8b5cf6 50%,
          #ec4899 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      p {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.95rem;
        color: #9ca3af;
        line-height: 1.7;
        margin-bottom: 2rem;
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.85rem;
        color: #60a5fa;
        text-decoration: none;
        padding: 0.75rem 1.5rem;
        border: 1px solid rgba(59, 130, 246, 0.3);
        border-radius: 8px;
        transition: all 0.2s;
      }

      .back-link:hover {
        background: rgba(59, 130, 246, 0.1);
        border-color: rgba(59, 130, 246, 0.6);
        transform: translateY(-2px);
      }

      /* Background grid */
      .bg-grid {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image:
          linear-gradient(rgba(59, 130, 246, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(59, 130, 246, 0.03) 1px, transparent 1px);
        background-size: 60px 60px;
      }
    </style>
  </head>
  <body>
    <div class="bg-grid"></div>
    <div class="container">
      <div class="scene">
        <div class="beaver">
          <div class="beaver-body">
            <div class="beaver-head">
              <div class="beaver-hat"></div>
              <div class="beaver-eye"></div>
              <div class="beaver-nose"></div>
              <div class="beaver-teeth"></div>
            </div>
            <div class="beaver-tail"></div>
          </div>
        </div>

        <div class="wall">
          <div class="brick-row">
            <div class="brick"></div>
            <div class="brick"></div>
            <div class="brick"></div>
          </div>
          <div class="brick-row">
            <div class="brick"></div>
            <div class="brick"></div>
          </div>
          <div class="brick-row">
            <div class="brick"></div>
            <div class="brick"></div>
            <div class="brick"></div>
          </div>
          <div class="brick-row">
            <div class="brick"></div>
            <div class="brick"></div>
          </div>
        </div>

        <div class="floating-brick">
          <div class="brick"></div>
        </div>

        <div class="ground"></div>
      </div>

      <h1><span class="gradient-text">Work in Progress</span></h1>
      <p>
        A beaver in a hard hat is working on this as fast as he can. Check back
        soon.
      </p>
      <a href="https://portfolio.skyhaven.ltd" class="back-link"
        >&larr; Back to portfolio</a
      >
    </div>
  </body>
</html>
